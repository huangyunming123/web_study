server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: biz-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 彻底解决中文乱码参数: characterEncoding=UTF-8 & characterSetResults=UTF-8
    url: jdbc:mysql://localhost:3306/mall_demo?useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 111111
  data:
    redis:
      host: localhost
      port: 6379
      password: 111111
      database: 0
      timeout: 5000ms

# 原生 MyBatis 框架配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.demo.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置 (必须与 auth-service 的 secret 完全保持一致)
jwt:
  secret: mall-demo-teaching-jwt-secret-key-must-be-at-least-256-bits-long-2026!
  expire-hours: 24

# Knife4j OpenAPI3 配置
knife4j:
  enable: true
  openapi:
    title: 核心业务微服务 API 文档
    description: 商城全栈微服务教学 Demo - 商品管理、地区字典树、用户管理接口
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.demo.biz.controller
