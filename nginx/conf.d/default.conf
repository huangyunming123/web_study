# =====================================================================
# Nginx 站点配置 (conf.d/default.conf)
# 角色定位: 作为整个系统的最外层入口，承担两大职责——
#   1) 托管前端静态资源 (Vue 3 + Vite 打包出的 dist)
#   2) 将 /auth、/api 等接口请求反向代理到后端 Spring Boot Gateway
# 部署形态: 通常运行在 Docker 容器内, 通过 host.docker.internal 访问宿主机后端
# =====================================================================

# 后端已有微服务网关集群地址 (Spring Boot Gateway :8080)
# 当 Spring Boot 应用运行在本地宿主机时，Docker 容器内可通过 host.docker.internal 访问
# upstream 定义一组上游服务器(可多个), Nginx 按负载均衡策略挑选, 这里只有一个节点

upstream gateway_upstream {
    # 上游网关地址: 宿主机 IP 别名 + Spring Boot Gateway 监听端口 8080
    server host.docker.internal:8080;
    # 与上游保持最多 32 个空闲长连接, 复用 TCP 连接, 减少频繁建连/断开开销
    keepalive 32;
}

# 备选架构: 若希望 Nginx 直接绕过 Spring Boot 网关分发到具体微服务，可启用以下两个 upstream:
# upstream auth_upstream {
#     server host.docker.internal:8081;
# }
# upstream biz_upstream {
#     server host.docker.internal:8082;
# }

# server 块: 定义一个虚拟主机(站点), 处理所有进入该端口的客户端请求
server {
    # listen 80: 监听容器内 80 端口 (HTTP 默认端口), 外部通过端口映射访问
    listen       80;
    # server_name: 匹配该站点的域名, 这里用 localhost 表示默认/本地访问
    server_name  localhost;
    # charset: 响应默认字符集, 避免中文乱码
    charset      utf-8;

    # 1. 静态资源托管：Vue 3 + Vite 构建产物 (dist 目录)
    # location /: 兜底匹配, 其它 location 都没命中时走这里(即前端页面请求)
    location / {
        # root: 静态文件在容器内的根目录, dist 一般被挂载/拷贝到此路径
        root   /usr/share/nginx/html;
        # index: 访问目录时默认返回的首页文件
        index  index.html index.htm;
        # 教学关键点: 解决 Vue Router History 模式刷新页面 404 问题
        # try_files: 依次尝试 真实文件($uri) → 目录($uri/) → 都找不到则回退到 /index.html
        # 这样前端路由(如 /user、/mall)刷新时也能由 SPA 自行接管, 而非返回 404
        try_files $uri $uri/ /index.html;
    }

    # 2. 鉴权微服务请求反向代理 (/auth/**)
    # location /auth/: 匹配所有以 /auth/ 开头的请求 (登录、注册等)
    location /auth/ {
        # proxy_pass: 转发到上游网关; 结尾带 / 表示替换掉 location 前缀后再拼接
        # 例: 客户端 /auth/login → 上游 gateway_upstream/auth/login
        proxy_pass http://gateway_upstream/auth/;
        
        # 基础请求头透传 (保证真实客户端 IP 与 Host 不丢失)
        # Host: 原始请求的主机名, 后端据此做域名判断/生成回调地址
        proxy_set_header Host $host;
        # X-Real-IP: 客户端真实 IP (单个), 避免后端只看到 Nginx 容器 IP
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For: 完整代理链 IP 列表, 多级代理时用于溯源
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto: 原始协议(http/https), 后端判断是否需强制跳转 HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP 1.1 与长连接
        # proxy_http_version 1.1: 使用 HTTP/1.1, 是启用上游长连接(keepalive)的前提
        proxy_http_version 1.1;
        # Connection "": 清空该头, 让连接可被复用而非每次关闭, 配合 upstream 的 keepalive
        proxy_set_header Connection "";

        # 客户端请求体大小与超时配置
        # client_max_body_size: 允许的最大请求体(上传文件等), 超出返回 413
        client_max_body_size 50m;
        # proxy_connect_timeout: 与后端建立连接的超时时间
        proxy_connect_timeout 10s;
        # proxy_read_timeout: 等待后端返回数据的超时时间(后端处理慢时适当调大)
        proxy_read_timeout 60s;
        # proxy_send_timeout: 向后端发送请求数据的超时时间
        proxy_send_timeout 60s;
    }

    # 3. 核心业务微服务请求反向代理 (/api/**)
    # location /api/: 匹配所有以 /api/ 开头的请求 (商品、地区、用户、订单等业务接口)
    # 配置项含义与上方 /auth/ 块完全一致, 仅转发路径前缀不同
    location /api/ {
        # 转发到网关的 /api/ 前缀, 由网关再路由到具体业务微服务 biz-service
        proxy_pass http://gateway_upstream/api/;
        
        # 基础请求头透传: 保留原始 Host 与客户端真实 IP / 协议信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP 1.1 + 空 Connection 头, 复用到上游网关的长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 请求体大小与各类超时限制
        client_max_body_size 50m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 4. 错误页处理
    # error_page: 当后端返回这些 5xx 状态码时, 统一展示内部路径 /50x.html
    error_page   500 502 503 504  /50x.html;
    # location = : 精确匹配 /50x.html, 从静态目录返回该错误页文件
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
