# ==============================================================================
# 教学 Demo 中间件编排文件：MySQL 8.0、Redis 7 与 Nginx 网关
# 启动命令: docker compose up -d
# 停止命令: docker compose down
# ==============================================================================

version: '3.8'

services:
  # MySQL 8.0 数据库服务
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 111111
      MYSQL_DATABASE: mall_demo
      TZ: Asia/Shanghai
    volumes:
      # 挂载 SQL 初始化脚本目录，容器首次启动时自动执行
      - ./sql:/docker-entrypoint-initdb.d
      # 挂载命名卷保证数据持久化
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  # Redis 7 缓存服务
  redis:
    image: redis:7
    container_name: mall-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass 111111
    volumes:
      # 挂载命名卷持久化 Redis 数据
      - redis-data:/data

  # Nginx 前端静态资源托管与反向代理网关 (Port 80)
  nginx:
    image: nginx:alpine
    container_name: mall-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./web/dist:/usr/share/nginx/html:ro
    extra_hosts:
      # 允许容器内通过 host.docker.internal 访问宿主机上运行的 Spring Boot 服务
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis

# 定义命名卷
volumes:
  mysql-data:
  redis-data:
